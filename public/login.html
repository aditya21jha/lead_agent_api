<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Royal Hair · Admin Login</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#eaf6ff;background:radial-gradient(circle at 15% 15%,#17476a 0,transparent 36%),radial-gradient(circle at 85% 80%,#33255f 0,transparent 34%),#061321}
.card{width:min(100%,420px);padding:32px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(9,28,47,.78);box-shadow:0 28px 90px rgba(0,0,0,.35);backdrop-filter:blur(20px)}
.brand{font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.2px}.sub{margin-top:7px;color:#9db8cc;font-size:11px;letter-spacing:2px;text-transform:uppercase}
h1{margin:32px 0 8px;font-size:21px}p{color:#a8bfd0;font-size:13px;line-height:1.6}
label{display:block;margin:22px 0 8px;font-size:12px;color:#c8d9e6}input{width:100%;padding:14px 15px;border:1px solid #29455e;border-radius:12px;background:#071827;color:white;outline:none}input:focus{border-color:#62d9e8;box-shadow:0 0 0 3px rgba(98,217,232,.12)}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:linear-gradient(120deg,#62d9e8,#3189cb);color:#061827;font-weight:800;cursor:pointer}
#message{min-height:20px;margin-top:14px;color:#ffb7bf;font-size:12px}footer{margin-top:22px;color:#6e8ca3;font-size:10px;text-align:center}
</style>
</head>
<body><main class="card">
<div class="brand">Royal Hair</div><div class="sub">Istanbul · Admin Console</div>
<h1>Sign in to your workspace</h1><p>This dashboard is restricted to the administrator. Sign in to manage leads, messages and campaigns.</p>
<form id="loginForm"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus maxlength="1024"><button id="submit" type="submit">Sign in securely</button><div id="message" role="status" aria-live="polite"></div></form>
<footer>Protected workspace · Royal Hair Istanbul</footer>
</main>
<script>
const form=document.getElementById('loginForm'),password=document.getElementById('password'),message=document.getElementById('message'),submit=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';submit.disabled=true;submit.textContent='Signing in…';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to sign in.');window.location.replace('/');}catch(err){message.textContent=err.message||'Unable to sign in.';}finally{submit.disabled=false;submit.textContent='Sign in securely';}});
</script></body></html>
